[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmbox"
version = "0.1.0"
description = "A lightweight research toolbox for vision-language models."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "vision-language-models",
    "multimodal",
    "transformers",
    "pytorch",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "transformers>=5.22.1,<6",
    "modelscope>=1.40.2",
    "numpy>=1.24",
    "accelerate>=1.10",
    "pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[project.urls]
Homepage = "https://github.com/czxvan/VLMBox"
Repository = "https://github.com/czxvan/VLMBox"
Issues = "https://github.com/czxvan/VLMBox/issues"

[tool.setuptools.packages.find]
include = ["vlmbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires CUDA and locally cached vision-language model checkpoints",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Pin the default package mirror so uv.lock resolves identically on every machine.
[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# One CUDA 13.0 build supports the RTX 3090 (Ampere) and RTX 4090 (Ada).
# Keep CUDA wheels explicit to prevent CPU-only PyTorch builds from being selected.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
