[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmbox"
version = "0.1.0"
description = "A lightweight research toolbox for vision-language models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "transformers>=5.22.1,<6",
    "modelscope>=1.40.2",
    "accelerate>=1.10",
    "pillow>=10.0",
    "torchvision>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
include = ["vlmbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
